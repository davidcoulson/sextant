name: Validate git

on:
  push:
  pull_request:
  schedule:
    - cron:  '0 0 * * *'

jobs:
  validate:
    name: Hassfest
    runs-on: "ubuntu-latest"
    steps:
        - uses: "actions/checkout@v7"
        - uses: "home-assistant/actions/hassfest@master"

  hacs:
    name: HACS Action
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v7"
      - name: HACS Action
        uses: "hacs/action@main"
        with:
          category: "integration"
          # Repository settings, not code: no topics, and issues are off.
          ignore: "topics issues"
