<svg xmlns="http://www.w3.org/2000/svg" width="940" height="380" viewBox="0 0 940 380" role="img" aria-label="How a room decides whether it is occupied">
<title>How a room decides whether it is occupied</title>
<rect x="0.5" y="0.5" width="939" height="379" rx="10" fill="#ffffff" stroke="#d0d7de"/>
<text x="20" y="30" font-size="16" fill="#1f2328" text-anchor="start" font-weight="bold" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">How a room decides, every cycle and every radar reading</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#59636e"/></marker></defs>
<rect x="20" y="55" width="230" height="62" rx="8" fill="#ddf4ff" stroke="#d0d7de"/>
<text x="135.0" y="77" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="bold" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">Bluetooth</text>
<text x="135.0" y="94" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">a phone, watch or pet tag</text>
<text x="135.0" y="111" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">placed here, heard &lt; 15 min</text>
<line x1="250" y1="86" x2="318" y2="190" stroke="#59636e" stroke-width="2" marker-end="url(#a)"/>
<rect x="20" y="130" width="230" height="62" rx="8" fill="#fbefff" stroke="#d0d7de"/>
<text x="135.0" y="152" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="bold" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">mmWave radar</text>
<text x="135.0" y="169" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">a verified track here</text>
<text x="135.0" y="186" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">or its hold (10 s)</text>
<line x1="250" y1="161" x2="318" y2="190" stroke="#59636e" stroke-width="2" marker-end="url(#a)"/>
<rect x="20" y="205" width="230" height="62" rx="8" fill="#fbefff" stroke="#d0d7de"/>
<text x="135.0" y="227" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="bold" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">Presence sensor</text>
<text x="135.0" y="244" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">the room&#x27;s LD2412</text>
<text x="135.0" y="261" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">on, or its hold</text>
<line x1="250" y1="236" x2="318" y2="190" stroke="#59636e" stroke-width="2" marker-end="url(#a)"/>
<rect x="20" y="280" width="230" height="62" rx="8" fill="#fbefff" stroke="#d0d7de"/>
<text x="135.0" y="302" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="bold" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">Other sensors</text>
<text x="135.0" y="319" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">motion, media, numbers</text>
<text x="135.0" y="336" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">on / playing / home / &gt; 20</text>
<line x1="250" y1="311" x2="318" y2="190" stroke="#59636e" stroke-width="2" marker-end="url(#a)"/>
<rect x="320" y="150" width="170" height="80" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="405.0" y="172" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="bold" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">Someone here?</text>
<text x="405.0" y="189" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">any source says yes</text>
<text x="405.0" y="206" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">(or the force switch)</text>
<line x1="490" y1="190" x2="548" y2="190" stroke="#59636e" stroke-width="2" marker-end="url(#a)"/>
<rect x="550" y="120" width="170" height="140" rx="8" fill="#fff8c5" stroke="#d0d7de"/>
<text x="635.0" y="142" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="bold" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">Settle</text>
<text x="635.0" y="159" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">clear-after hold</text>
<text x="635.0" y="176" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">door hold</text>
<text x="635.0" y="193" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">(door_settle_secs,</text>
<text x="635.0" y="210" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">door_hold_max_secs)</text>
<text x="635.0" y="227" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">extended timer</text>
<line x1="720" y1="190" x2="768" y2="190" stroke="#59636e" stroke-width="2" marker-end="url(#a)"/>
<rect x="770" y="100" width="150" height="50" rx="8" fill="#2da44e" stroke="#d0d7de"/>
<text x="845.0" y="130.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">occupied</text>
<text x="845.0" y="130.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="normal" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"></text>
<rect x="770" y="165" width="150" height="50" rx="8" fill="#116329" stroke="#d0d7de"/>
<text x="845.0" y="195.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">extended</text>
<text x="845.0" y="195.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="normal" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"></text>
<rect x="770" y="230" width="150" height="50" rx="8" fill="#d8dee4" stroke="#d0d7de"/>
<text x="845.0" y="260.0" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="bold" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">clear</text>
<text x="845.0" y="260.0" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"></text>
<rect x="550" y="290" width="370" height="62" rx="8" fill="#fff1e5" stroke="#d0d7de"/>
<text x="735.0" y="312" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="bold" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">After a restart</text>
<text x="735.0" y="329" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">a room that was on stays on for up to 600 s,</text>
<text x="735.0" y="346" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">until a real reading confirms it</text>
</svg>
