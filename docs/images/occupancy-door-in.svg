<text x="20" y="276" font-size="12" fill="#59636e" text-anchor="start" font-weight="normal" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">Robin&#x27;s phone is charging in the kitchen, so only the motion sensor sees them. The hold keeps the room on while they lie still.</text>
